name: Product artifact
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libssl-dev libcurl4-openssl-dev openssh-server
      - run: scripts/dev bootstrap --no-native
      - run: scripts/dev check
      - run: scripts/dev build-ui --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hunkra-linux-x86_64
          path: target/release/hunkra
          if-no-files-found: error
