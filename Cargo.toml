[workspace]
members = ["crates/hunkra-core", "crates/hunkra"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/b4rgut/hunkra"
publish = false

[workspace.dependencies]
gix = { version = "=0.88.0", default-features = false, features = ["basic", "status", "sha1", "sha256", "blocking-http-transport-curl-openssl", "worktree-mutation"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0
